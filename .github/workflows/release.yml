name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: DeskPet v__VERSION__
          releaseBody: |
            ## Download

            Pick the installer for your system, install or extract, then open DeskPet. **Node.js is not required.**

            | System | File |
            |--------|------|
            | Windows | `.msi` or `.exe` |
            | macOS (Apple silicon) | `.dmg` with `aarch64` |
            | macOS (Intel) | `.dmg` with `x86_64` |
            | Linux | `.deb` or `.AppImage` |

            On first macOS open, if you see “cannot verify the developer,” allow it in System Settings → Privacy & Security.

            ### Linux tip (Wayland)

            If the pet does not stay always-on-top under Wayland, launch with X11:

            ```bash
            env WAYLAND_DISPLAY= GDK_BACKEND=x11 DeskPet
            ```

            (Exact binary name may vary by package.)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
